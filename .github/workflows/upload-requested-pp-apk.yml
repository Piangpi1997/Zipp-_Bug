name: Add requested PP APK
on:
  push:
    branches: [feat/pp-apk-builder]
    paths: ['.github/workflows/upload-requested-pp-apk.yml']
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pp-apk-builder
      - uses: actions/download-artifact@v4
        with:
          name: pp-apk-builder-upstream-debug
          path: /tmp/pp-apk
          run-id: 42177764179
          github-token: ${{ github.token }}
      - name: Verify and commit requested APK
        run: |
          echo '1c3d94a509d800555eb130e9a60d14290206caa4c7d2bca5f8dde756a252061e  /tmp/pp-apk/app-standard-debug.apk' | sha256sum --check
          mkdir -p downloads
          cp /tmp/pp-apk/app-standard-debug.apk downloads/PP_APK_BUILDER_Brand_Beta_Debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads/PP_APK_BUILDER_Brand_Beta_Debug.apk
          git rm .github/workflows/upload-requested-pp-apk.yml
          git commit -m "Add PP APK BUILDER beta debug APK"
          git push origin HEAD:feat/pp-apk-builder
