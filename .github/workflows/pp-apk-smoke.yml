name: PP APK Builder installation smoke test
on:
  push:
    branches: [feat/pp-apk-builder]
    paths: ['.github/workflows/pp-apk-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for branded APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 42144011686 --repo Piangpi1997/Zipp-_Bug --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: pp-apk-builder-upstream-debug
          path: new
          run-id: 42144011686
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pp-apk-builder-upstream-debug
          path: old
          run-id: 42133503385
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pp-apk-builder-upstream-debug
          path: previous
          run-id: 42140926093
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install both APKs and launch PP Studio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install old/app-standard-debug.apk
            adb install previous/app-standard-debug.apk
            if adb install -r new/app-standard-debug.apk; then
              echo 'PREVIOUS_APP_UPDATE=success'
            else
              echo 'PREVIOUS_APP_UPDATE=signature_conflict_or_other_failure'
              adb uninstall com.piangpi.ppapkbuilder
              adb install new/app-standard-debug.apk
            fi
            adb shell pm list packages | grep -Fx 'package:com.webtoapp'
            adb shell pm list packages | grep -Fx 'package:com.piangpi.ppapkbuilder'
            adb shell am start -W -n com.piangpi.ppapkbuilder/com.webtoapp.ui.zipstudio.ZipStudioActivity
            sleep 8
            adb shell pidof com.piangpi.ppapkbuilder
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -F 'zipstudio.ZipStudioActivity'
            adb shell uiautomator dump /sdcard/pp-window.xml
            adb exec-out cat /sdcard/pp-window.xml > /tmp/pp-window.xml
            read -r x y < <(python3 -c 'import re,xml.etree.ElementTree as E; root=E.parse("/tmp/pp-window.xml"); n=next(x for x in root.iter("node") if "Builder Home" in x.attrib.get("text","")); a=list(map(int,re.findall(r"[0-9]+",n.attrib["bounds"]))); print((a[0]+a[2])//2,(a[1]+a[3])//2)')
            adb shell input tap "$x" "$y"
            sleep 8
            adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -F '.ui.MainActivity'
            adb exec-out screencap -p > /tmp/pp-studio-branded.png
      - uses: actions/upload-artifact@v4
        with:
          name: pp-branded-studio-screen
          path: /tmp/pp-studio-branded.png
          if-no-files-found: error
