name: Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 34
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Require release signing secrets
        shell: bash
        env:
          ZIPBUG_KEYSTORE_B64: ${{ secrets.ZIPBUG_KEYSTORE_B64 }}
          ZIPBUG_KEYSTORE_PASSWORD: ${{ secrets.ZIPBUG_KEYSTORE_PASSWORD }}
          ZIPBUG_KEY_ALIAS: ${{ secrets.ZIPBUG_KEY_ALIAS }}
          ZIPBUG_KEY_PASSWORD: ${{ secrets.ZIPBUG_KEY_PASSWORD }}
        run: |
          test -n "$ZIPBUG_KEYSTORE_B64" || { echo "Missing ZIPBUG_KEYSTORE_B64"; exit 2; }
          test -n "$ZIPBUG_KEYSTORE_PASSWORD" || { echo "Missing ZIPBUG_KEYSTORE_PASSWORD"; exit 2; }
          test -n "$ZIPBUG_KEY_ALIAS" || { echo "Missing ZIPBUG_KEY_ALIAS"; exit 2; }
          test -n "$ZIPBUG_KEY_PASSWORD" || { echo "Missing ZIPBUG_KEY_PASSWORD"; exit 2; }

      - name: Materialize temporary release keystore
        shell: bash
        env:
          ZIPBUG_KEYSTORE_B64: ${{ secrets.ZIPBUG_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$ZIPBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zipbug-release.jks"
          test -s "$RUNNER_TEMP/zipbug-release.jks"

      - name: Test and lint
        run: |
          node --check app/src/main/assets/studio/studio-core.js
          node --check app/src/main/assets/studio/studio.js
          node scripts/test-studio-core.js
          gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build signed release
        env:
          ZIPBUG_RELEASE_KEYSTORE: ${{ runner.temp }}/zipbug-release.jks
          ZIPBUG_KEYSTORE_PASSWORD: ${{ secrets.ZIPBUG_KEYSTORE_PASSWORD }}
          ZIPBUG_KEY_ALIAS: ${{ secrets.ZIPBUG_KEY_ALIAS }}
          ZIPBUG_KEY_PASSWORD: ${{ secrets.ZIPBUG_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify signed release
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/zipbug-release.jks"
