name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/antigravity-studio-v2
      - feat/zippy-ide-unified
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 34
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Resolve SDK tool paths
        shell: bash
        run: |
          # CI images normally ship build-tools 34.0.0, but fall back to the
          # PATH so the verify steps still work if the layout changes.
          BT=""
          for candidate in \
            "$ANDROID_HOME/build-tools/34.0.0" \
            "$ANDROID_HOME/build-tools/34.0.0-rc3" \
            /usr/lib/android-sdk/build-tools/34.0.0; do
            if [ -x "$candidate/apksigner" ]; then BT="$candidate"; break; fi
          done
          if [ -z "$BT" ]; then
            BT="$(dirname "$(command -v apksigner 2>/dev/null || echo /nonexistent/x)")"
          fi
          if [ ! -x "$BT/apksigner" ]; then
            echo "::error::apksigner not found in build-tools or PATH"
            exit 1
          fi
          AAPT2="$BT/aapt2"
          if [ ! -x "$AAPT2" ]; then AAPT2="$(command -v aapt2 || true)"; fi
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found in build-tools or PATH"
            exit 1
          fi
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"
          echo "apksigner: $BT/apksigner"
          echo "aapt2: $AAPT2"

      - name: Validate project
        run: python verify-project.py

      - name: Studio JS tests
        run: |
          node --check app/src/main/assets/studio/studio-core.js
          node --check app/src/main/assets/studio/studio.js
          node scripts/test-studio-core.js
          node --test app/src/test/js/studio-core.test.js

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Build preview APK (side-by-side, com.zipbug.base.preview)
        run: gradle --no-daemon assemblePreview

      - name: Verify preview APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/preview/app-preview.apk
          "$BT/apksigner" verify --verbose app/build/outputs/apk/preview/app-preview.apk
          "$AAPT2" dump badging app/build/outputs/apk/preview/app-preview.apk | grep -q "package: name='com.zipbug.base.preview'"

      - name: Compile unsigned release candidate
        run: gradle --no-daemon assembleRelease

      - name: Verify unsigned release output
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
