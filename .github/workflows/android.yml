name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/antigravity-studio-v2
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 34
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Validate project
        run: python verify-project.py

      - name: Studio JS tests
        run: |
          node --check app/src/main/assets/studio/studio-core.js
          node --check app/src/main/assets/studio/studio.js
          node scripts/test-studio-core.js
          node --test app/src/test/js/studio-core.test.js

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Build preview APK (side-by-side, com.zipbug.base.preview)
        run: gradle --no-daemon assemblePreview

      - name: Verify preview APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/preview/app-preview.apk | grep -q "package: name='com.zipbug.base.preview'"

      - name: Compile unsigned release candidate
        run: gradle --no-daemon assembleRelease

      - name: Verify unsigned release output
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-preview
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Zip_Bug-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
